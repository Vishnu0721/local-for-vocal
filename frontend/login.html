<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KalaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold" href="index.html">KalaConnect</a>
            <ul class="navbar-nav ms-auto align-items-center" id="nav-links"></ul>
        </div>
    </nav>

    <div class="row g-0 auth-wrapper" style="min-height: calc(100vh - 70px);">
        <!-- LEft Side Image Panel -->
        <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center text-white"
            style="background: linear-gradient(135deg, rgba(198, 93, 59, 0.9), rgba(46, 46, 46, 0.9)), url('https://images.unsplash.com/photo-1544967082-d9d25d867d66?auto=format&fit=crop&q=80') center/cover;">
            <div class="p-5 text-center">
                <h1 class="display-5 fw-bold brand-font mb-4 text-white">Welcome Back</h1>
                <p class="lead" style="color: #F5F1E8;">Continue empowering local artisans and discovering unique
                    heritage crafts.</p>
            </div>
        </div>

        <!-- Right Side Form Panel -->
        <div class="col-md-6 d-flex justify-content-center align-items-center bg-white">
            <div class="w-100 p-5" style="max-width: 450px;">
                <div class="text-center mb-5">
                    <h2 class="fw-bold brand-font text-dark mb-2">Login to your account</h2>
                    <p class="text-muted">Enter your credentials below</p>
                </div>
                <div id="alertBox"></div>

                <form id="loginForm">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        <label for="email" class="text-muted">Email address</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                        <label for="password" class="text-muted">Password</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3">Sign In</button>
                    <p class="text-center text-muted">New here? <a href="register.html"
                            class="text-primary fw-bold text-decoration-none">Create Account</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("token")) {
                const token = localStorage.getItem("token");
                const decoded = window.decodeToken(token);
                if (decoded && decoded.role) {
                    if (decoded.role === "admin") window.location.href = "admin-dashboard.html";
                    else if (decoded.role === "artisan") window.location.href = "artisan-dashboard.html";
                    else window.location.href = "customer-dashboard.html";
                }
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const alertBox = document.getElementById('alertBox');
            btn.innerHTML = 'Signing in...';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${window.API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    alertBox.innerHTML = '<div class="alert alert-success">Login successful. Redirecting...</div>';

                    setTimeout(() => {
                        if (data.user.role === 'admin') window.location.href = 'admin-dashboard.html';
                        else if (data.user.role === 'artisan') window.location.href = 'artisan-dashboard.html';
                        else window.location.href = 'customer-dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(data.message || 'Login failed');
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Local for Vocal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--spacing-lg);
            padding: var(--spacing-lg) 0;
            min-height: calc(100vh - 80px - 200px);
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 1px solid var(--color-secondary);
            border-radius: var(--border-radius);
            background-color: var(--color-surface);
            gap: 1rem;
        }

        .cart-item-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: var(--border-radius);
            background-color: var(--color-secondary);
        }

        .cart-item-details {
            flex: 1;
        }

        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid var(--color-secondary);
            border-radius: var(--border-radius);
            overflow: hidden;
            width: fit-content;
        }

        .qty-btn {
            background-color: var(--color-bg);
            border: none;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            font-weight: 700;
        }

        .qty-input {
            width: 40px;
            text-align: center;
            border: none;
            border-left: 1px solid var(--color-secondary);
            border-right: 1px solid var(--color-secondary);
            padding: 0.5rem 0;
            font-family: inherit;
        }

        .cart-summary {
            background-color: var(--color-bg);
            padding: var(--spacing-md);
            border-radius: var(--border-radius-lg);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: var(--color-text-main);
        }

        .summary-total {
            font-weight: 700;
            font-size: 1.2rem;
            border-top: 1px solid var(--color-secondary);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container navbar">
            <a href="/" class="logo">
                Local for Vocal
                <span>Visakhapatnam Artisans</span>
            </a>

            <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/pages/products.html" class="nav-link">Shop Collection</a>

                <div id="auth-links" class="d-flex gap-sm align-items-center">
                    <!-- JS handles this -->
                </div>

                <div id="user-links" class="d-flex gap-sm align-items-center hide">
                    <!-- JS handles this -->
                </div>
            </nav>
        </div>
    </header>

    <main class="container cart-container">
        <!-- Cart Items -->
        <div>
            <h1 class="title-md mb-4" style="color: var(--color-primary-dark);">Your Cart</h1>
            <div id="alert-container" class="hide mb-4"></div>

            <div id="cartItemsContainer" class="cart-items">
                <div class="loader-container"><span class="loader"></span></div>
            </div>
        </div>

        <!-- Summary -->
        <aside class="cart-summary">
            <h2 class="title-sm mb-4">Order Summary</h2>

            <div class="summary-row text-muted">
                <span>Subtotal (<span id="totalItems">0</span> items)</span>
                <span id="subtotalAmount">₹0</span>
            </div>

            <div class="summary-row text-muted">
                <span>Shipping</span>
                <span>Free</span>
            </div>

            <div class="summary-row summary-total">
                <span>Total</span>
                <span id="totalAmount">₹0</span>
            </div>

            <button id="checkoutBtn" class="btn btn-primary w-100 mt-4" style="padding: 1rem; font-size:1.1rem;"
                disabled>
                Proceed to Checkout
            </button>
        </aside>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto">
        <div class="container text-center">
            <div class="footer-bottom" style="border: none;">
                &copy; <span id="current-year"></span> Local for Vocal Platform. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/pages/login.html';
                return;
            }

            const container = document.getElementById('cartItemsContainer');
            const totalItemsEl = document.getElementById('totalItems');
            const subtotalAmountEl = document.getElementById('subtotalAmount');
            const totalAmountEl = document.getElementById('totalAmount');
            const checkoutBtn = document.getElementById('checkoutBtn');
            const alertCont = document.getElementById('alert-container');

            let currentCart = [];

            async function loadCart() {
                try {
                    // Try fetch from backend API
                    const cartData = await API.get('/cart', true);
                    currentCart = cartData.items || cartData;
                    renderCart();
                } catch (error) {
                    // Fallback to local storage for demo purposes if backend API /cart is not ready
                    console.log("Cart API failed, falling back to local cart");
                    currentCart = JSON.parse(localStorage.getItem('cart') || '[]');
                    renderCart();
                }
            }

            function renderCart() {
                if (!Array.isArray(currentCart) || currentCart.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <p class="text-muted mb-4">Your cart is empty.</p>
                            <a href="/pages/products.html" class="btn btn-primary">Start Shopping</a>
                        </div>
                    `;
                    updateSummary(0, 0);
                    checkoutBtn.disabled = true;
                    return;
                }

                let subtotal = 0;
                let itemsCount = 0;

                container.innerHTML = currentCart.map((item, index) => {
                    const price = item.price || item.product?.price || 0;
                    const name = item.name || item.product?.name || 'Item';
                    const qty = item.qty || 1;
                    const pId = item.productId || item.product?._id;

                    subtotal += (price * qty);
                    itemsCount += qty;

                    return `
                    <div class="cart-item">
                        <div class="cart-item-img"></div>
                        <div class="cart-item-details">
                            <h3 class="title-sm" style="margin-bottom: 0.5rem;">${name}</h3>
                            <p style="font-weight: 700; color: var(--color-primary); font-size: 1.1rem;">
                                ${Main.formatCurrency(price)}
                            </p>
                        </div>
                        <div class="d-flex flex-column align-items-end gap-sm">
                            <div class="qty-control">
                                <button onclick="updateQty('${pId}', -1)" class="qty-btn" ${qty <= 1 ? 'disabled' : ''}>-</button>
                                <input type="text" class="qty-input" value="${qty}" readonly>
                                <button onclick="updateQty('${pId}', 1)" class="qty-btn">+</button>
                            </div>
                            <button onclick="removeItem('${pId}')" class="btn" style="color: #dc3545; padding: 0.5rem; text-transform:none; font-weight:normal;">Remove</button>
                        </div>
                    </div>
                    `;
                }).join('');

                updateSummary(itemsCount, subtotal);
                checkoutBtn.disabled = false;
            }

            function updateSummary(count, amount) {
                totalItemsEl.textContent = count;
                subtotalAmountEl.textContent = Main.formatCurrency(amount);
                totalAmountEl.textContent = Main.formatCurrency(amount);
            }

            window.updateQty = async function (productId, change) {
                try {
                    // Simulation of updating quantity
                    const item = currentCart.find(i => (i.productId === productId || i.product?._id === productId));
                    if (item) {
                        item.qty += change;
                        if (item.qty < 1) item.qty = 1;

                        // Try syncing with API
                        try { await API.post('/cart', { productId, qty: item.qty }, true); } catch (e) { }

                        // Sync Local
                        localStorage.setItem('cart', JSON.stringify(currentCart));
                        renderCart();
                    }
                } catch (e) { console.error(e); }
            }

            window.removeItem = async function (productId) {
                try {
                    currentCart = currentCart.filter(i => (i.productId !== productId && i.product?._id !== productId));

                    // Try syncing with API - usually a DELETE request but we adapt
                    try { await API.post(`/cart/remove/${productId}`, {}, true); } catch (e) { }

                    // Sync local
                    localStorage.setItem('cart', JSON.stringify(currentCart));
                    renderCart();
                } catch (e) { console.error(e); }
            }

            checkoutBtn.addEventListener('click', async () => {
                const originalText = checkoutBtn.textContent;
                checkoutBtn.innerHTML = 'Processing...';
                checkoutBtn.disabled = true;

                try {
                    // Create Order payload assuming backend shape
                    const orderPayload = {
                        orderItems: currentCart,
                        shippingAddress: { address: 'Local AP', city: 'Visakhapatnam', postalCode: '530001', country: 'India' },
                        paymentMethod: 'Cash On Delivery',
                        itemsPrice: currentCart.reduce((a, c) => a + ((c.price || c.product?.price || 0) * c.qty), 0),
                        shippingPrice: 0,
                        totalPrice: currentCart.reduce((a, c) => a + ((c.price || c.product?.price || 0) * c.qty), 0)
                    };

                    await API.post('/orders', orderPayload, true);

                    // Clear cart
                    currentCart = [];
                    localStorage.removeItem('cart');
                    try { await API.post('/cart/clear', {}, true); } catch (e) { }

                    Main.showAlert('alert-container', 'Order placed successfully!', 'success');

                    setTimeout(() => {
                        window.location.href = '/pages/dashboard.html#orders';
                    }, 2000);

                } catch (error) {
                    Main.showAlert('alert-container', error.message || 'Failed to place order.');
                    checkoutBtn.innerHTML = originalText;
                    checkoutBtn.disabled = false;
                }
            });

            // Initialize
            loadCart();
        });
    </script>
</body>

</html>

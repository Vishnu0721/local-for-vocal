<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Local for Vocal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .auth-container {
            min-height: calc(100vh - 80px);
            /* Minus header approx */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
            background-color: var(--color-bg);
            background-image: linear-gradient(to left, rgba(160, 90, 69, 0.05), transparent);
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: var(--spacing-lg) var(--spacing-md);
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container navbar">
            <a href="/" class="logo" style="text-align: center; width: 100%; align-items: center;">
                Local for Vocal
            </a>
        </div>
    </header>

    <main class="auth-container">
        <div class="card auth-card shadow-lg" style="border-top: 4px solid var(--color-primary);">
            <h1 class="title-md text-center mb-2"
                style="font-family: var(--font-heading); color: var(--color-primary-dark);">Welcome Back</h1>
            <p class="text-center text-muted mb-4">Login to access your account</p>

            <div id="alert-container" class="hide"></div>

            <form id="loginForm">
                <div class="form-group mb-4">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required
                        placeholder="your@email.com" value="test@test.com">
                </div>

                <div class="form-group mb-4" style="margin-bottom: var(--spacing-md);">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label" style="margin: 0;">Password</label>
                        <a href="#" style="font-size: 0.8rem; color: var(--color-primary);">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" class="form-control mt-2" required
                        placeholder="••••••••" value="password123">
                </div>

                <button type="submit" class="btn btn-primary w-100"
                    style="width: 100%; font-size: 1.1rem; padding: 1rem;">
                    Sign In
                </button>
            </form>

            <div class="text-center mt-4">
                <p style="color: var(--color-text-muted);">
                    Don't have an account?
                    <a href="/pages/register.html"
                        style="color: var(--color-primary); font-weight: 700; text-decoration: underline;">Register
                        here</a>
                </p>
            </div>
        </div>
    </main>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already logged in
            if (localStorage.getItem('token')) {
                window.location.href = '/pages/dashboard.html';
            }

            const form = document.getElementById('loginForm');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                Main.hideAlert('alert-container');

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;

                try {
                    submitBtn.innerHTML = '<span class="loader" style="width:20px;height:20px;border-width:2px;vertical-align:middle;margin-right:10px;"></span> Signing In...';
                    submitBtn.disabled = true;

                    const response = await API.post('/auth/login', { email, password });

                    // Store JWT token and user details
                    localStorage.setItem('token', response.token);
                    localStorage.setItem('user', JSON.stringify(response.user || response.data));

                    // Show success
                    Main.showAlert('alert-container', 'Login successful! Redirecting...', 'success');

                    // Redirect based on role or to common dashboard
                    setTimeout(() => {
                        window.location.href = '/pages/dashboard.html';
                    }, 1000);

                } catch (error) {
                    Main.showAlert('alert-container', error.message || 'Invalid email or password.');
                } finally {
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>

</html>

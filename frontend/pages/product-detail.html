<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Local for Vocal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .product-section {
            padding: var(--spacing-lg) 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-xl);
            align-items: start;
        }

        .product-images {
            position: sticky;
            top: 100px;
        }

        .main-image {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: var(--border-radius-lg);
            background-color: var(--color-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .thumbnail-list {
            display: flex;
            gap: 1rem;
        }

        .thumbnail {
            width: 80px;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: var(--border-radius);
            background-color: var(--color-bg);
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .thumbnail.active,
        .thumbnail:hover {
            border-color: var(--color-primary);
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .badge {
            background-color: var(--color-bg);
            color: var(--color-primary-dark);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            width: fit-content;
            border: 1px solid var(--color-primary);
        }

        .product-price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-primary);
            font-family: var(--font-heading);
            margin-bottom: var(--spacing-md);
        }

        /* Unique Feature: Journey Timeline */
        .journey-section {
            background-color: var(--color-surface);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--color-primary);
        }

        .timeline {
            position: relative;
            padding-left: 2rem;
            margin-top: 1.5rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--color-secondary);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2.35rem;
            /* center on the line */
            top: 0.2rem;
            width: 1rem;
            height: 1rem;
            background-color: var(--color-primary);
            border: 3px solid white;
            border-radius: 50%;
            z-index: 1;
        }

        .timeline-title {
            font-weight: 700;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .timeline-icon {
            width: 18px;
            height: 18px;
            color: var(--color-primary);
        }

        @media (max-width: 768px) {
            .product-section {
                grid-template-columns: 1fr;
            }

            .product-images {
                position: static;
            }
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container navbar">
            <a href="/" class="logo">
                Local for Vocal
                <span>Visakhapatnam Artisans</span>
            </a>

            <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/pages/products.html" class="nav-link active">Shop Collection</a>

                <div id="auth-links" class="d-flex gap-sm align-items-center">
                    <!-- JS handles this -->
                </div>

                <div id="user-links" class="d-flex gap-sm align-items-center hide">
                    <!-- JS handles this -->
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Navigation Breadcrumb -->
        <div class="mt-4" style="color: var(--color-text-muted); font-size: 0.9rem;">
            <a href="/">Home</a> / <a href="/pages/products.html">Shop</a> / <span id="bc-name">Product Name</span>
        </div>

        <div id="alert-container" class="hide mt-4"></div>
        <div id="product-container">
            <div class="loader-container" style="min-height: 50vh;"><span class="loader"></span></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto">
        <div class="container text-center">
            <div class="footer-bottom" style="border: none;">
                &copy; <span id="current-year"></span> Local for Vocal Platform. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const container = document.getElementById('product-container');
            const breadcrumbEl = document.getElementById('bc-name');

            if (!productId) {
                container.innerHTML = '<div class="alert alert-error">Product ID missing</div>';
                return;
            }

            try {
                // Fetch specific product by ID
                const product = await API.get(`/products/${productId}`);

                // Update Breadcrumb
                document.title = `${product.name} | Local for Vocal`;
                breadcrumbEl.textContent = product.name;

                // Format missing data with placeholders if incomplete schema
                const artisanName = product.artisanName || 'Local Artisan';
                const originLoc = product.originLocation || 'Visakhapatnam Region';
                const materials = product.materials || 'Locally sourced natural materials';
                const story = product.story || 'Handcrafted with traditional techniques passed down through generations.';
                const stockStatus = product.countInStock > 0 ? `<span style="color: #10b981; font-weight:700;">In Stock</span>` : `<span style="color: #dc3545; font-weight:700;">Out of Stock</span>`;

                container.innerHTML = `
                    <section class="product-section">
                        <!-- Left: Images -->
                        <div class="product-images">
                            <div class="main-image"></div>
                            <div class="thumbnail-list mt-3">
                                <div class="thumbnail active"></div>
                                <div class="thumbnail"></div>
                                <div class="thumbnail"></div>
                            </div>
                        </div>
                        
                        <!-- Right: Details -->
                        <div class="product-info">
                            <div class="badge">${product.category || 'Handicraft'}</div>
                            <h1 class="title-lg" style="margin-bottom: 0.5rem; line-height: 1.1;">${product.name}</h1>
                            <p class="text-muted" style="font-size: 1.1rem; margin-bottom: 1rem;">Crafted by <strong>${artisanName}</strong></p>
                            
                            <div class="product-price">${Main.formatCurrency(product.price)}</div>
                            
                            <p style="margin-bottom: 1.5rem; line-height: 1.8;">${product.description || 'No description available for this authentic craft.'}</p>
                            
                            <div style="background-color: var(--color-bg); padding: 1rem; border-radius: var(--border-radius); margin-bottom: 2rem;">
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Availability:</span>
                                    ${stockStatus}
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span>Shipping:</span>
                                    <span style="font-weight: 500;">Free within AP</span>
                                </div>
                            </div>
                            
                            <button id="addToCartBtn" class="btn btn-primary" style="padding: 1.2rem; font-size: 1.1rem;" ${product.countInStock <= 0 ? 'disabled' : ''}>
                                Add to Cart
                            </button>
                            
                            <!-- Key Attributes -->
                            <div class="mt-4 pt-4" style="border-top: 1px solid var(--color-secondary);">
                                <div class="d-flex gap-sm align-items-center mb-3 text-muted">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                                    Authenticity Guaranteed
                                </div>
                                <div class="d-flex gap-sm align-items-center text-muted">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path></svg>
                                    Production Date: ${new Date(product.createdAt || Date.now()).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    <!-- Unique Feature: Product Journey Section (Below Fold) -->
                    <section class="journey-section">
                        <h2 class="title-md" style="font-style: italic;">The Journey of the Product</h2>
                        <p class="text-muted" style="max-width: 800px; margin-top: 0.5rem;">Trace the path of this handcrafted piece from its origin to its final form.</p>
                        
                        <div class="timeline">
                            <div class="timeline-item">
                                <h3 class="timeline-title">
                                    <svg class="timeline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                    Geographical Origin: <span style="color: var(--color-text-main); font-weight:normal; margin-left: 0.5rem">${originLoc}</span>
                                </h3>
                                <p class="text-muted" style="margin-left: 1.8rem;">Every craft begins its life deeply rooted in the soil of its regional heritage.</p>
                            </div>
                            
                            <div class="timeline-item">
                                <h3 class="timeline-title">
                                    <svg class="timeline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                                    Material Selection: <span style="color: var(--color-text-main); font-weight:normal; margin-left: 0.5rem">${materials}</span>
                                </h3>
                                <p class="text-muted" style="margin-left: 1.8rem;">Artisans carefully select natural resources sustainable to the environment, ensuring quality and tradition.</p>
                            </div>
                            
                            <div class="timeline-item">
                                <h3 class="timeline-title">
                                    <svg class="timeline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                    The Artisan's Story: <span style="color: var(--color-text-main); font-weight:normal; margin-left: 0.5rem">${artisanName}'s Craft</span>
                                </h3>
                                <p class="text-muted" style="margin-left: 1.8rem;">${story}</p>
                            </div>
                            
                            <!-- Artisan spotlight integration (Small card within timeline) -->
                            <div style="margin-left: 1.8rem; margin-top: 1rem; padding: 1rem; background-color: var(--color-bg); border-radius: var(--border-radius); border: 1px solid var(--color-secondary); display:flex; align-items:center; gap: 1rem; max-width: 400px;">
                                <div style="width: 50px; height: 50px; border-radius: 50%; background-color: var(--color-primary); color: white; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1.5rem;">
                                    ${artisanName.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <span style="font-weight: 700; display:block;">Supported by You</span>
                                    <span style="font-size: 0.8rem; color: var(--color-text-muted);">100% of profit goes directly to the creator.</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Reviews & Location map section -->
                    <section class="mt-5 pt-5 mb-5" style="border-top: 1px solid var(--color-secondary);">
                        <div class="grid grid-2 gap-lg">
                            <div class="reviews">
                                <h3 class="title-md mb-4">Customer Reviews</h3>
                                <div class="card mb-3 p-4" style="background-color: var(--color-bg); border: none;">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <div style="font-weight: 700;">Aarti S.</div>
                                        <div style="color: #fbbf24; font-size: 1.2rem;">★★★★★</div>
                                    </div>
                                    <p class="text-muted" style="margin: 0; font-size: 0.95rem;">"Absolutely stunning craftsmanship. The details are incredible and you can feel the authenticity. Highly recommend this artisan's work!"</p>
                                </div>
                                <div class="card p-4" style="background-color: var(--color-bg); border: none;">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <div style="font-weight: 700;">Ramesh K.</div>
                                        <div style="color: #fbbf24; font-size: 1.2rem;">★★★★☆</div>
                                    </div>
                                    <p class="text-muted" style="margin: 0; font-size: 0.95rem;">"Beautiful piece! Packaging was decent, and it arrived in perfect condition. It brings a real traditional vibe to my living room."</p>
                                </div>
                                <button class="btn btn-secondary mt-3">Write a Review</button>
                            </div>
                            
                            <div class="location-map">
                                <h3 class="title-md mb-4">Origin Map</h3>
                                <div class="card p-0" style="overflow: hidden; border-radius: var(--border-radius-lg); height: 300px; position: relative; background-color: #d1bda2; display: flex; align-items: center; justify-content: center; text-align: center; border: 2px solid var(--color-primary);">
                                    <div style="position: absolute; inset: 0; background-image: radial-gradient(circle at center, transparent, rgba(160, 90, 69, 0.4));"></div>
                                    <div style="z-index: 1;">
                                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-dark)" stroke-width="2" style="background: white; border-radius: 50%; padding: 5px; margin-bottom: 0.5rem;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                        <h4 style="color: var(--color-primary-dark); margin:0;">${originLoc}</h4>
                                        <p style="color: var(--color-primary-dark); font-size: 0.8rem; opacity: 0.8; margin-top: 5px;">Interactive Map Placeholder</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                `;

                // Add To Cart Event
                document.getElementById('addToCartBtn').addEventListener('click', async (e) => {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        window.location.href = '/pages/login.html';
                        return;
                    }

                    const btn = e.target;
                    const originalText = btn.textContent;

                    try {
                        btn.innerHTML = 'Adding...';
                        btn.disabled = true;

                        // Add to Backend Cart
                        await API.post('/cart', { productId: product._id, qty: 1 }, true);

                        btn.innerHTML = '✓ Added';
                        btn.style.backgroundColor = '#10b981';

                        setTimeout(() => {
                            window.location.href = '/pages/cart.html';
                        }, 1000);

                    } catch (error) {
                        console.error("Cart API Fallback Triggered", error);
                        // Local storage fallback for frontend-only demo
                        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                        let existing = cart.find(i => i.productId === product._id);
                        if (existing) existing.qty += 1;
                        else cart.push({
                            productId: product._id,
                            name: product.name,
                            price: product.price,
                            qty: 1
                        });
                        localStorage.setItem('cart', JSON.stringify(cart));

                        btn.innerHTML = '✓ Added to Cart';
                        btn.style.backgroundColor = '#10b981';

                        setTimeout(() => {
                            window.location.href = '/pages/cart.html';
                        }, 1000);
                    }
                });

            } catch (error) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <h2 class="title-md text-muted mb-3">Product not found</h2>
                        <p class="mb-4">The craft you are looking for might have been removed or the ID is invalid.</p>
                        <a href="/pages/products.html" class="btn btn-primary">Return to Shop</a>
                    </div>
                `;
            }
        });
    </script>
</body>

</html>

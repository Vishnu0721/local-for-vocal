<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Collection | Local for Vocal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .shop-header {
            background-color: var(--color-bg);
            padding: var(--spacing-lg) 0;
            text-align: center;
            border-bottom: 1px solid var(--color-secondary);
        }

        .products-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: var(--spacing-lg);
            padding: var(--spacing-lg) 0;
        }

        .filters {
            background-color: var(--color-surface);
            padding: var(--spacing-md);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-sm);
            height: fit-content;
        }

        .filter-group {
            margin-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--color-secondary);
            padding-bottom: var(--spacing-md);
        }

        .filter-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .filter-title {
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--color-text-main);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .filter-option {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text-muted);
            cursor: pointer;
        }

        .filter-option input {
            margin-right: 0.5rem;
            accent-color: var(--color-primary);
        }

        .search-bar {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--color-secondary);
            border-radius: var(--border-radius);
            margin-bottom: var(--spacing-md);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        @media (max-width: 768px) {
            .products-layout {
                grid-template-columns: 1fr;
            }

            .filter-mobile-toggle {
                display: block;
                margin-bottom: var(--spacing-md);
            }

            .filters {
                display: none;
            }

            .filters.active {
                display: block;
            }
        }

        .add-to-cart-btn {
            background-color: var(--color-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .add-to-cart-btn:hover {
            background-color: var(--color-primary-dark);
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container navbar">
            <a href="/" class="logo">
                Local for Vocal
                <span>Visakhapatnam Artisans</span>
            </a>

            <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/pages/products.html" class="nav-link active">Shop Collection</a>

                <div id="auth-links" class="d-flex gap-sm align-items-center">
                    <a href="/pages/login.html" class="nav-link">Login</a>
                    <a href="/pages/register.html" class="btn btn-primary" style="padding: 0.5rem 1rem;">Register</a>
                </div>

                <div id="user-links" class="d-flex gap-sm align-items-center hide">
                    <!-- Managed by JS -->
                </div>
            </nav>
        </div>
    </header>

    <!-- Page Header -->
    <section class="shop-header">
        <div class="container">
            <h1 class="title-lg" style="color: var(--color-primary-dark);">Discover The Collection</h1>
            <p class="text-muted" style="max-width: 600px; margin: 0 auto;">Explore genuine handmade creations from
                local artisans. Every purchase supports their livelihood and preserves traditional arts.</p>
        </div>
    </section>

    <!-- Shop Layout -->
    <main class="container products-layout">
        <!-- Sidebar Filters -->
        <aside>
            <button id="filterToggleBtn" class="btn btn-secondary w-100 mb-3 filter-mobile-toggle hide"
                style="display: none;">
                Show Filters
            </button>

            <div id="filterMenu" class="filters">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search products...">

                <div class="filter-group">
                    <div class="filter-title">Categories</div>
                    <label class="filter-option">
                        <input type="radio" name="category" value="" checked> All
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="category" value="Toys"> Kondapalli Toys
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="category" value="Woodcraft"> Etikoppaka Woodcraft
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="category" value="Textiles"> Handloom Textiles
                    </label>
                </div>

                <div class="filter-group">
                    <div class="filter-title">Sort By</div>
                    <select id="sortSelect" class="search-bar" style="margin-bottom: 0;">
                        <option value="newest">Newest First</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Product Grid -->
        <section>
            <div id="alert-container" class="hide mb-4"></div>

            <div id="productsGrid" class="grid grid-3">
                <!-- Loader -->
                <div class="loader-container" style="grid-column: 1/-1;"><span class="loader"></span></div>
            </div>

            <!-- Pagination -->
            <div id="pagination-container" class="d-flex justify-content-center mt-5"
                style="border-top: 1px solid var(--color-secondary); padding-top: 2rem;">
                <!-- Filled by JS -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <div class="footer-bottom" style="border: none;">
                &copy; <span id="current-year"></span> Local for Vocal Platform. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mobile Filter Toggle
            const filterToggleBtn = document.getElementById('filterToggleBtn');
            const filterMenu = document.getElementById('filterMenu');

            // Un-hide toggle button only on mobile via CSS query (inline fallback)
            if (window.innerWidth <= 768) {
                filterToggleBtn.style.display = 'block';
            }

            filterToggleBtn.addEventListener('click', () => {
                filterMenu.classList.toggle('active');
                filterToggleBtn.textContent = filterMenu.classList.contains('active') ? 'Hide Filters' : 'Show Filters';
            });

            let allProducts = [];
            let currentPage = 1;
            const itemsPerPage = 6;
            const grid = document.getElementById('productsGrid');
            const searchInput = document.getElementById('searchInput');
            const categoryRadios = document.querySelectorAll('input[name="category"]');
            const sortSelect = document.getElementById('sortSelect');
            const paginationContainer = document.getElementById('pagination-container');

            async function fetchProducts() {
                try {
                    allProducts = await API.get('/products');
                    applyFilters(); // Call applyFilters to render with pagination
                } catch (error) {
                    grid.innerHTML = '<p class="text-center" style="grid-column:1/-1;">Check back soon for available crafts.</p>';
                    Main.showAlert('alert-container', 'Failed to load products from server.', 'error');
                }
            }

            function renderProducts(products) {
                if (products.length === 0) {
                    grid.innerHTML = `
                        <div class="text-center" style="grid-column: 1/-1; padding: 4rem 0;">
                            <h3 class="title-sm" style="color: var(--color-text-muted);">No products found matching your criteria.</h3>
                            <button onclick="document.querySelector('input[name=category][value=\\'\\']').click(); document.getElementById('searchInput').value='';" class="btn btn-secondary mt-3">Reset Filters</button>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = products.map(product => `
                    <div class="card" style="display: flex; flex-direction: column;">
                        <a href="/pages/product-detail.html?id=${product._id}" style="display: block; text-decoration: none; color: inherit; flex: 1;">
                            <div class="card-img-wrapper" style="background-color: var(--color-secondary);">
                                <!-- image here -->
                            </div>
                            <div class="card-content" style="padding-bottom: 0;">
                                <h3 class="title-sm" style="margin-bottom: 0.25rem;">${product.name}</h3>
                                <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 1rem;">By ${product.artisanName || 'Local Artisan'}</p>
                                <span style="font-weight: 700; color: var(--color-primary); display:block; margin-bottom: 1rem; font-size: 1.1rem;">
                                    ${Main.formatCurrency(product.price)}
                                </span>
                            </div>
                        </a>
                        <button onclick="addToCart('${product._id}', '${product.name.replace(/'/g, "\\'")}', ${product.price})" class="add-to-cart-btn">Add to Cart</button>
                    </div>
                `).join('');
            }

            // Filter Logic
            function applyFilters() {
                const term = searchInput.value.toLowerCase();
                const selectedCat = document.querySelector('input[name="category"]:checked').value;
                const sort = sortSelect.value;

                let filtered = allProducts.filter(p => {
                    const matchesSearch = p.name.toLowerCase().includes(term);
                    const matchesCat = selectedCat === '' || p.category === selectedCat;
                    return matchesSearch && matchesCat;
                });

                if (sort === 'price_asc') {
                    filtered.sort((a, b) => a.price - b.price);
                } else if (sort === 'price_desc') {
                    filtered.sort((a, b) => b.price - a.price);
                }

                // Pagination Logic
                const totalPages = Math.ceil(filtered.length / itemsPerPage);
                if (currentPage > totalPages) currentPage = totalPages || 1;

                const startIdx = (currentPage - 1) * itemsPerPage;
                const paginated = filtered.slice(startIdx, startIdx + itemsPerPage);

                renderProducts(paginated);
                renderPagination(totalPages);
            }

            function renderPagination(totalPages) {
                if (totalPages <= 1) {
                    paginationContainer.innerHTML = '';
                    return;
                }

                paginationContainer.innerHTML = `
                    <button onclick="changePage(-1)" class="btn btn-secondary" style="margin-right: 1rem;" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
                    <div style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: var(--color-primary); color: white; border-radius: 50%;">${currentPage}</div>
                    <button onclick="changePage(1)" class="btn btn-secondary" style="margin-left: 1rem;" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
                `;
            }

            window.changePage = function (dir) {
                currentPage += dir;
                applyFilters();
                window.scrollTo({ top: 300, behavior: 'smooth' });
            };

            searchInput.addEventListener('input', () => { currentPage = 1; applyFilters(); });
            categoryRadios.forEach(r => r.addEventListener('change', () => { currentPage = 1; applyFilters(); }));
            sortSelect.addEventListener('change', () => { currentPage = 1; applyFilters(); });

            fetchProducts();

            // Handle URL params (e.g. from homepage "Support Artisan")
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('artisan')) {
                // Usually handled backend, here we simulate by searching
                searchInput.value = urlParams.get('artisan');
                setTimeout(applyFilters, 500); // give time to load
            }
        });

        // Expose addToCart to global window for onclick attr
        window.addToCart = async function (id, name, price) {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/pages/login.html';
                return;
            }

            try {
                // Post to cart API
                await API.post('/cart', { productId: id, qty: 1 }, true);
                alert(`Added ${name} to cart!`);
            } catch (error) {
                // If API doesn't exist yet, we'll store locally for UI demo
                console.error("Cart API failed:", error);
                const localCart = JSON.parse(localStorage.getItem('cart') || '[]');
                const existing = localCart.find(i => i.productId === id);
                if (existing) {
                    existing.qty += 1;
                } else {
                    localCart.push({ productId: id, name, price, qty: 1 });
                }
                localStorage.setItem('cart', JSON.stringify(localCart));
                alert(`Added ${name} to cart (local mode)!`);
            }
        };
    </script>
</body>

</html>

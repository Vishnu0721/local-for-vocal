<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Local for Vocal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .dashboard-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: calc(100vh - 80px - 200px);
            /* header and footer approx */
            gap: var(--spacing-md);
            padding: var(--spacing-md) 0;
        }

        .sidebar {
            background-color: var(--color-surface);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-md);
            box-shadow: var(--shadow-sm);
            height: fit-content;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-link {
            padding: 0.8rem 1rem;
            border-radius: var(--border-radius);
            font-weight: 500;
            color: var(--color-text-main);
            transition: var(--transition);
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background-color: rgba(160, 90, 69, 0.1);
            color: var(--color-primary-dark);
        }

        .dashboard-content {
            background-color: var(--color-surface);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-md);
            box-shadow: var(--shadow-sm);
        }

        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
        }

        /* Artisan Specific */
        .product-list-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--color-secondary);
            gap: 1rem;
        }

        .product-list-item:last-child {
            border-bottom: none;
        }

        .product-thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--border-radius);
            background-color: var(--color-secondary);
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container navbar">
            <a href="/" class="logo">
                Local for Vocal
                <span>Visakhapatnam Artisans</span>
            </a>

            <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/pages/products.html" class="nav-link">Shop Collection</a>

                <div id="auth-links" class="d-flex gap-sm align-items-center">
                    <!-- Managed by JS -->
                </div>

                <!-- Authenticated Links -->
                <div id="user-links" class="d-flex gap-sm align-items-center hide">
                    <!-- Managed by JS -->
                </div>
            </nav>
        </div>
    </header>

    <main class="container dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="text-center mb-4 pb-4" style="border-bottom: 1px solid var(--color-secondary);">
                <div
                    style="width: 80px; height: 80px; border-radius: 50%; background-color: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-family: var(--font-heading); margin: 0 auto 1rem;">
                    <span id="user-initial">U</span>
                </div>
                <h2 id="user-name" class="title-sm" style="margin-bottom: 0.25rem;">Loading...</h2>
                <p id="user-role" class="text-muted"
                    style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Role</p>
            </div>

            <nav id="dynamic-sidebar" class="sidebar-nav">
                <!-- Dynamically populated based on role -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <section class="dashboard-content">
            <div id="alert-container" class="hide mb-4"></div>

            <div id="content-area">
                <!-- Dynamically populated -->
                <div class="loader-container"><span class="loader"></span></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem;">&copy; <span id="current-year"></span> Local for
                Vocal Platform. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check Auth
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');

            if (!token || !userStr) {
                window.location.href = '/pages/login.html';
                return;
            }

            const user = JSON.parse(userStr);
            console.log("Logged in user:", user);

            // Setup Profile Info
            document.getElementById('user-name').textContent = user.name || 'User';
            document.getElementById('user-role').textContent = user.role || 'Customer';
            if (user.name) {
                document.getElementById('user-initial').textContent = user.name.charAt(0).toUpperCase();
            }

            // Setup Sidebar depending on role
            const sidebar = document.getElementById('dynamic-sidebar');
            const contentArea = document.getElementById('content-area');

            if (user.role === 'Artisan') {
                renderArtisanSidebar(sidebar);
                loadArtisanProducts(contentArea);
            } else {
                renderCustomerSidebar(sidebar);
                loadCustomerOrders(contentArea);
            }

            // View routing based on hash
            window.addEventListener('hashchange', () => {
                const hash = window.location.hash || '#overview';

                // Update active link
                document.querySelectorAll('.sidebar-link').forEach(link => link.classList.remove('active'));
                const activeLink = document.querySelector(`.sidebar-link[href="${hash}"]`);
                if (activeLink) activeLink.classList.add('active');

                // Render content
                if (user.role === 'Artisan') {
                    if (hash === '#add-product') renderAddProductForm(contentArea);
                    else if (hash === '#products') loadArtisanProducts(contentArea);
                    else renderArtisanOverview(contentArea);
                } else {
                    if (hash === '#cart') window.location.href = '/pages/cart.html';
                    else if (hash === '#profile') renderProfileForm(contentArea, user);
                    else loadCustomerOrders(contentArea);
                }
            });

            // Trigger initial route
            if (!window.location.hash) window.location.hash = user.role === 'Artisan' ? '#products' : '#orders';
            else window.dispatchEvent(new Event('hashchange'));
        });

        /* ========================
           ARTISAN VIEWS
        ======================== */
        function renderArtisanSidebar(container) {
            container.innerHTML = `
                <a href="#overview" class="sidebar-link">Dashboard Overview</a>
                <a href="#products" class="sidebar-link active">My Products</a>
                <a href="#add-product" class="sidebar-link">+ Add New Product</a>
                <a href="#orders" class="sidebar-link">Customer Orders</a>
                <button onclick="Main.logout()" class="sidebar-link" style="text-align:left; background:none; border:none; cursor:pointer; width:100%;">Log Out</button>
            `;
        }

        function renderArtisanOverview(container) {
            container.innerHTML = `
                <h2 class="title-md" style="color: var(--color-primary-dark); margin-bottom: 2rem;">Overview</h2>
                <div class="grid grid-3 mb-4">
                    <div class="card" style="padding: 1.5rem; text-align: center; background-color: var(--color-bg);">
                        <h4 class="text-muted">Total Products</h4>
                        <p class="title-lg" style="color: var(--color-primary);">--</p>
                    </div>
                    <div class="card" style="padding: 1.5rem; text-align: center; background-color: var(--color-bg);">
                        <h4 class="text-muted">Pending Orders</h4>
                        <p class="title-lg" style="color: var(--color-primary);">--</p>
                    </div>
                </div>
            `;
        }

        async function loadArtisanProducts(container) {
            container.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="title-md" style="color: var(--color-primary-dark);">My Products</h2>
                    <a href="#add-product" class="btn btn-primary btn-sm">Add New</a>
                </div>
                <div id="artisan-products-list"><div class="loader-container"><span class="loader"></span></div></div>
            `;

            try {
                // Should fetch products for this specific artisan. Assuming a route exists.
                // Using generic product list for now if specific one doesn't exist
                const products = await API.get('/products/artisan', true).catch(() => API.get('/products'));

                const list = document.getElementById('artisan-products-list');

                if (products && products.length > 0) {
                    list.innerHTML = products.map(p => `
                        <div class="product-list-item">
                            <div class="product-thumbnail"></div>
                            <div style="flex:1;">
                                <h4 style="margin: 0;">${p.name}</h4>
                                <p class="text-muted" style="margin: 0; font-size: 0.9rem;">${Main.formatCurrency(p.price)} • Stock: ${p.stock || 1}</p>
                            </div>
                            <div class="d-flex gap-sm">
                                <button onclick="editProduct('${p._id}')" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Edit</button>
                                <button onclick="deleteProduct('${p._id}')" class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; background-color: #dc3545;">Delete</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p class="text-center text-muted py-5">You haven\'t added any products yet.</p>';
                }

            } catch (error) {
                document.getElementById('artisan-products-list').innerHTML = `
                    <div class="alert alert-error">Failed to load products: ${error.message}</div>
                `;
            }
        }

        function renderAddProductForm(container) {
            container.innerHTML = `
                <h2 class="title-md" style="color: var(--color-primary-dark); margin-bottom: 2rem;">Add New Product</h2>
                <form id="addProductForm">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="p_name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Price (INR)</label>
                            <input type="number" id="p_price" class="form-control" required min="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <select id="p_category" class="form-control" required>
                                <option value="">Select Category</option>
                                <option value="Toys">Kondapalli Toys</option>
                                <option value="Woodcraft">Etikoppaka Woodcraft</option>
                                <option value="Textiles">Textiles</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Stock Quantity</label>
                            <input type="number" id="p_countInStock" class="form-control" required min="1" value="1">
                        </div>
                    </div>
                    
                    <div class="form-group mt-3">
                        <label class="form-label">Description</label>
                        <textarea id="p_description" class="form-control" rows="4" required></textarea>
                    </div>
                    
                    <h3 class="title-sm mt-4 mb-3" style="border-bottom: 1px solid var(--color-secondary); padding-bottom: 0.5rem;">Product Journey / Story</h3>
                    
                    <div class="form-group">
                        <label class="form-label">Origin Location</label>
                        <input type="text" id="p_location" class="form-control" placeholder="e.g. Kondapalli Village">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Materials Used</label>
                        <input type="text" id="p_materials" class="form-control" placeholder="e.g. Tella Poniki Wood, Natural dyes">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">The Story behind this craft</label>
                        <textarea id="p_story" class="form-control" rows="3"></textarea>
                    </div>
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary w-100" style="padding: 1rem;">Publish Product</button>
                    </div>
                </form>
            `;

            document.getElementById('addProductForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                Main.hideAlert('alert-container');

                const productData = {
                    name: document.getElementById('p_name').value,
                    price: document.getElementById('p_price').value,
                    category: document.getElementById('p_category').value,
                    countInStock: document.getElementById('p_countInStock').value,
                    description: document.getElementById('p_description').value,
                    // Unique features:
                    originLocation: document.getElementById('p_location').value,
                    materials: document.getElementById('p_materials').value,
                    story: document.getElementById('p_story').value
                };

                try {
                    const sb = e.target.querySelector('button[type="submit"]');
                    sb.disabled = true; sb.innerHTML = 'Publishing...';

                    await API.post('/products', productData, true);

                    Main.showAlert('alert-container', 'Product added successfully!', 'success');
                    e.target.reset();

                    setTimeout(() => {
                        window.location.hash = '#products';
                    }, 1500);

                } catch (error) {
                    Main.showAlert('alert-container', error.message || 'Failed to add product');
                    e.target.querySelector('button[type="submit"]').disabled = false;
                    e.target.querySelector('button[type="submit"]').innerHTML = 'Publish Product';
                }
            });
        }

        window.deleteProduct = async function (id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            try {
                // DELETE request using API.post as a workaround if API.delete doesn't exist, but ideal is DELETE
                // Let's implement local logic fallback 
                await API.post(`/products/delete/${id}`, {}, true);
                Main.showAlert('alert-container', 'Product deleted successfully', 'success');
                loadArtisanProducts(document.getElementById('content-area'));
            } catch (err) {
                Main.showAlert('alert-container', 'Product deleted (frontend demo).', 'success');
                loadArtisanProducts(document.getElementById('content-area'));
            }
        };

        window.editProduct = function (id) {
            Main.showAlert('alert-container', 'Edit functionality opens a modal or navigates to an edit page (To Be Implemented).', 'success');
        };

        /* ========================
           CUSTOMER VIEWS
        ======================== */
        function renderCustomerSidebar(container) {
            container.innerHTML = `
                <a href="#orders" class="sidebar-link active">My Orders</a>
                <a href="#profile" class="sidebar-link">My Profile</a>
                <a href="/pages/cart.html" class="sidebar-link d-flex justify-content-between">
                    Cart <span style="background:var(--color-primary);color:white;border-radius:50%;padding:2px 8px;font-size:0.8rem;">0</span>
                </a>
                <button onclick="Main.logout()" class="sidebar-link" style="text-align:left; background:none; border:none; cursor:pointer; width:100%;">Log Out</button>
            `;
        }

        async function loadCustomerOrders(container) {
            container.innerHTML = `
                 <h2 class="title-md" style="color: var(--color-primary-dark); margin-bottom: 2rem;">Order History</h2>
                 <div id="orders-list"><div class="loader-container"><span class="loader"></span></div></div>
            `;

            try {
                const orders = await API.get('/orders', true);
                const list = document.getElementById('orders-list');

                if (orders && orders.length > 0) {
                    list.innerHTML = orders.map(o => `
                        <div class="card mb-3" style="padding: 1rem; border: 1px solid var(--color-secondary);">
                            <div class="d-flex justify-content-between align-items-center mb-2" style="border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">
                                <strong>Order #${(o._id).substring(0, 8).toUpperCase()}</strong>
                                <span style="background: ${o.isDelivered ? '#d1fae5' : '#fee2e2'}; color: ${o.isDelivered ? '#065f46' : '#991b1b'}; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem;">
                                    ${o.isDelivered ? 'Delivered' : 'Processing'}
                                </span>
                            </div>
                            <p class="text-muted" style="margin: 0; font-size: 0.9rem;">Date: ${new Date(o.createdAt).toLocaleDateString()}</p>
                            <p style="margin: 0; font-weight: 700;">Total: ${Main.formatCurrency(o.totalPrice)}</p>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <p class="text-muted mb-4">You haven't placed any orders yet.</p>
                            <a href="/pages/products.html" class="btn btn-primary">Start Shopping</a>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('orders-list').innerHTML = `
                    <div class="alert alert-error">Make sure the API routes are setup correctly on Backend to fetch Orders.<br>${error.message}</div>
                `;
            }
        }

        function renderProfileForm(container, user) {
            container.innerHTML = `
                <h2 class="title-md" style="color: var(--color-primary-dark); margin-bottom: 2rem;">My Profile</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" value="${user.name}" readonly disabled style="background:#f9f9f9;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" value="${user.email}" readonly disabled style="background:#f9f9f9;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Account Type</label>
                        <input type="text" class="form-control" value="${user.role || 'Customer'}" readonly disabled style="background:#f9f9f9;">
                    </div>
                    <p class="text-muted" style="font-size: 0.85rem; margin-top: 1rem;">Profile updating is currently disabled in this demo.</p>
                </form>
            `;
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | KalaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .role-radio {
            display: none;
        }

        .role-label {
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            flex: 1;
            font-weight: bold;
        }

        .role-radio:checked+.role-label {
            background-color: var(--primary);
            color: white;
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold" href="index.html">KalaConnect</a>
            <ul class="navbar-nav ms-auto align-items-center" id="nav-links"></ul>
        </div>
    </nav>

    <div class="row g-0 auth-wrapper" style="min-height: calc(100vh - 70px);">
        <!-- Right Side Image Panel (opposite of login for flair) -->
        <div class="col-md-6 order-md-2 d-none d-md-flex flex-column justify-content-center align-items-center text-white"
            style="background: linear-gradient(135deg, rgba(212, 175, 55, 0.9), rgba(198, 93, 59, 0.9)), url('https://images.unsplash.com/photo-1606760227091-3dd870d97f1d?auto=format&fit=crop&q=80') center/cover;">
            <div class="p-5 text-center">
                <h1 class="display-5 fw-bold brand-font mb-4 text-white">Join the Movement</h1>
                <p class="lead" style="color: #F5F1E8;">Become part of the community that values authenticity, heritage,
                    and pure origin crafts.</p>
            </div>
        </div>

        <!-- Left Side Form Panel -->
        <div class="col-md-6 order-md-1 d-flex justify-content-center align-items-center bg-white">
            <div class="w-100 p-5" style="max-width: 500px;" id="formContainer">
                <div class="text-center mb-5">
                    <h2 class="fw-bold brand-font text-dark mb-2" id="formTitle">Create your account</h2>
                    <p class="text-muted">Start your journey with KalaConnect</p>
                </div>
                <div id="alertBox"></div>

                <form id="registerForm">
                    <div class="d-flex gap-3 mb-4">
                        <input type="radio" name="role" id="roleCustomer" value="customer" class="role-radio" checked>
                        <label for="roleCustomer" class="role-label p-2 px-3 small">Customer</label>
                        <input type="radio" name="role" id="roleArtisan" value="artisan" class="role-radio">
                        <label for="roleArtisan" class="role-label p-2 px-3 small">Artisan</label>
                        <input type="radio" name="role" id="roleAdmin" value="admin" class="role-radio">
                        <label for="roleAdmin" class="role-label p-2 px-3 small">Admin</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                        <label for="name" class="text-muted">Full Name</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        <label for="email" class="text-muted">Email address</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="tel" class="form-control" id="phone" placeholder="Phone Number" required>
                        <label for="phone" class="text-muted">Phone Number</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                        <label for="password" class="text-muted">Password</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3">Sign Up</button>
                    <p class="text-center text-muted">Already have an account? <a href="login.html"
                            class="text-primary fw-bold text-decoration-none">Login</a></p>
                </form>
            </div>

            <!-- Verification Form, Hidden initially -->
            <div class="w-100 p-5 d-none" style="max-width: 500px;" id="verifyContainer">
                <div class="text-center mb-5">
                    <h2 class="fw-bold brand-font text-dark mb-2">Verify Email</h2>
                    <p class="text-muted">Enter the 6-digit OTP sent to your email.</p>
                </div>
                <div id="verifyAlertBox"></div>

                <form id="verifyForm">
                    <div class="mb-4 text-center">
                        <input type="text" class="form-control form-control-lg text-center fw-bold fs-3 border-primary"
                            id="otp" maxlength="6" required placeholder="••••••" style="letter-spacing: 12px;">
                    </div>
                    <button type="submit" class="btn btn-secondary btn-lg w-100 fw-bold">Verify & Login</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        let registeredEmail = '';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const alertBox = document.getElementById('alertBox');
            btn.innerHTML = 'Creating account...';
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            try {
                const response = await fetch(`${window.API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password, role })
                });

                const data = await response.json();

                if (response.ok) {
                    registeredEmail = email; // Save for verify logic
                    alertBox.innerHTML = '<div class="alert alert-success">Registration successful. Check your email for OTP.</div>';

                    setTimeout(() => {
                        document.getElementById('formContainer').classList.add('d-none');
                        document.getElementById('verifyContainer').classList.remove('d-none');
                    }, 1500);
                } else {
                    throw new Error(data.message || 'Registration failed');
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
                btn.innerHTML = 'Sign Up';
                btn.disabled = false;
            }
        });

        // Verify OTP logic
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const alertBox = document.getElementById('verifyAlertBox');
            btn.innerHTML = 'Verifying...';
            btn.disabled = true;

            const otp = document.getElementById('otp').value;

            try {
                const response = await fetch(`${window.API_URL}/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: registeredEmail, otp })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    alertBox.innerHTML = '<div class="alert alert-success">Email verified successfully. Redirecting...</div>';

                    setTimeout(() => {
                        if (data.user.role === 'admin') window.location.href = 'admin-dashboard.html';
                        else if (data.user.role === 'artisan') window.location.href = 'artisan-dashboard.html';
                        else window.location.href = 'customer-dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(data.message || 'Verification failed');
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
                btn.innerHTML = 'Verify & Login';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Artisans | KalaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #artisanMap {
            height: 600px;
            width: 100%;
            border-radius: 12px;
            z-index: 1;
            /* Keep map under the nav */
        }

        .artisan-card-hover {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .artisan-card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1) !important;
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold" href="index.html">KalaConnect</a>
            <ul class="navbar-nav ms-auto align-items-center" id="nav-links"></ul>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <div class="bg-primary text-white text-center py-5">
            <h1 class="display-5 fw-bold brand-font">Hyperlocal Artisan Map</h1>
            <p class="lead mb-0">Discover the heritage of Visakhapatnam, craft by craft.</p>
        </div>
    </div>

    <div class="container my-5">
        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <select id="locationFilter" class="form-select border-primary shadow-sm rounded-pill py-2 px-4 shadow">
                    <option value="all">📍 All Locations</option>
                </select>
            </div>
            <div class="col-md-6">
                <select id="skillFilter" class="form-select border-primary shadow-sm rounded-pill py-2 px-4 shadow">
                    <option value="all">🛠️ All Crafts</option>
                </select>
            </div>
        </div>
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-2">
                    <div id="artisanMap"></div>
                </div>
            </div>
            <div class="col-lg-4" style="max-height: 600px; overflow-y: auto;">
                <h4 class="fw-bold mb-4">Local Artisans <span class="badge bg-primary" id="artGrpCount">0</span></h4>
                <div id="artisanList" class="d-flex flex-column gap-3">
                    <div class="text-center text-muted py-5">Loading artisans...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
    <script>
        let map;
        let markers = {};
        let markerLayer;

        document.addEventListener('DOMContentLoaded', async () => {
            // Setup Map
            map = L.map('artisanMap').setView([17.6868, 83.2185], 11); // Vizag Center
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '© OpenStreetMap KalaConnect'
            }).addTo(map);

            markerLayer = L.layerGroup().addTo(map);

            try {
                const res = await window.fetchAPI('/artisans', 'GET');
                const artisans = res.data || [];

                // Get unique locations & skills
                const locations = [...new Set(artisans.map(a => a.village).filter(Boolean))];
                let allSkills = [];
                artisans.forEach(a => { if (a.skills) allSkills.push(...a.skills) });
                const skillsSet = [...new Set(allSkills.map(s => s.trim()))];

                const locFilter = document.getElementById('locationFilter');
                locations.forEach(v => {
                    locFilter.appendChild(new Option(v, v));
                });

                const skFilter = document.getElementById('skillFilter');
                skillsSet.forEach(s => {
                    skFilter.appendChild(new Option(s, s));
                });

                renderArtisans(artisans);

                locFilter.addEventListener('change', () => filterArtisans(artisans));
                skFilter.addEventListener('change', () => filterArtisans(artisans));

            } catch (err) {
                document.getElementById('artisanList').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            }
        });

        function filterArtisans(artisans) {
            const lVal = document.getElementById('locationFilter').value;
            const sVal = document.getElementById('skillFilter').value;

            const filtered = artisans.filter(a => {
                const matchLoc = lVal === 'all' || a.village === lVal;
                const matchSkill = sVal === 'all' || (a.skills && a.skills.includes(sVal));
                return matchLoc && matchSkill;
            });
            renderArtisans(filtered);

            // Re-center if a location is selected (and not 'all') and has data
            if (lVal !== 'all' && filtered.length > 0) {
                const firstValid = filtered.find(a => (a.latitude || (a.location && a.location.latitude)));
                if (firstValid) {
                    const lat = firstValid.latitude || firstValid.location.latitude;
                    const lng = firstValid.longitude || firstValid.location.longitude;
                    map.setView([lat, lng], 13);
                }
            } else if (lVal === 'all') {
                map.setView([17.6868, 83.2185], 11);
            }
        }

        function renderArtisans(artisans) {
            document.getElementById('artGrpCount').innerText = artisans.length;
            const listContainer = document.getElementById('artisanList');
            markerLayer.clearLayers();
            markers = {};

            if (artisans.length === 0) {
                listContainer.innerHTML = `<div class="alert alert-info border-0 shadow-sm text-center">No matching artisans found.</div>`;
                return;
            }

            listContainer.innerHTML = '';
            const customIcon = L.divIcon({
                className: 'custom-pin',
                html: `<div style="background: var(--primary); color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border: 2px solid white;"><i class="fas fa-hammer"></i></div>`,
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [0, -40]
            });

            artisans.forEach(a => {
                // Populate Map
                if (a.latitude || a.longitude || a.location) {
                    const lat = a.latitude || (a.location && a.location.latitude) || (17.6 + (Math.random() * 0.2));
                    const lng = a.longitude || (a.location && a.location.longitude) || (83.1 + (Math.random() * 0.2));

                    const marker = L.marker([lat, lng], { icon: customIcon }).addTo(markerLayer);
                    marker.bindPopup(`
                            <div class="text-center">
                                <img src="${a.photo || 'https://via.placeholder.com/50'}" class="rounded-circle mb-2" width="50" height="50" style="object-fit:cover;">
                                <h6 class="fw-bold mb-1">${a.userId.name}</h6>
                                <p class="small text-muted mb-2">${a.village || 'Vizag'}</p>
                                <a href="artisan-public.html?id=${a.userId._id}" class="btn btn-sm btn-primary w-100">View Profile</a>
                            </div>
                        `);
                    markers[a._id] = { marker, lat, lng };
                }

                // Populate List
                const cardHtml = `
                        <div class="card border-0 shadow-sm rounded-4 artisan-card-hover" style="cursor: pointer;" onclick="flyToArtisan('${a._id}')">
                            <div class="card-body p-3 d-flex align-items-center gap-3">
                                <img src="${a.photo || 'https://via.placeholder.com/80'}" class="rounded-circle" style="width: 70px; height: 70px; object-fit: cover;">
                                <div>
                                    <h6 class="fw-bold mb-1">${a.userId.name} <i class="fas fa-check-circle text-success small"></i></h6>
                                    <p class="text-muted small mb-1"><i class="fas fa-map-marker-alt text-danger"></i> ${a.village || 'Visakhapatnam'}</p>
                                    <div class="d-flex gap-1 mb-2">
                                        ${(a.skills || []).slice(0, 2).map(s => `<span class="badge bg-light text-dark border">${s}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                listContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function flyToArtisan(id) {
            const m = markers[id];
            if (m) {
                map.flyTo([m.lat, m.lng], 15, { animate: true, duration: 1.5 });
                setTimeout(() => m.marker.openPopup(), 1500);
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category | KalaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold brand-font" href="/index.html">KalaConnect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex mx-auto w-50" id="searchForm" onsubmit="handleSearch(event)">
                    <input class="form-control me-2 rounded-pill bg-light border-0" type="search" id="searchInput"
                        placeholder="Search artisans or crafts..." aria-label="Search">
                    <button class="btn btn-primary rounded-pill px-4 fw-bold" type="submit">Search</button>
                </form>
                <ul class="navbar-nav ms-auto align-items-center" id="nav-links">
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="/cart.html"><i class="fas fa-shopping-cart me-1"></i>Cart
                            <span id="cartCount" class="badge bg-danger rounded-pill">0</span></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="fw-bold mb-3 brand-font border-bottom pb-2 text-dark" id="categoryTitle">Category: Loading...</h2>
        <p class="text-muted mb-4" id="categoryDesc"></p>

        <div class="row g-4" id="productsGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Loading products...</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 fw-bold">&copy; 2026 KalaConnect. All rights reserved.</p>
            <p class="small text-muted mt-1">Empowering local artisans directly.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = window.location.pathname.split('/').pop() || urlParams.get('slug'); // Handle both /category/slug and category.html?slug=xyz

            if (!slug) {
                document.getElementById('categoryTitle').innerText = "Category not found.";
                return;
            }

            try {
                const catRes = await fetch(`${window.API_URL}/categories`);
                const cats = await catRes.json();
                const categoryObj = cats.data.find(c => c.slug === slug);

                if (!categoryObj) {
                    document.getElementById('categoryTitle').innerText = "Category not found.";
                    document.getElementById('productsGrid').innerHTML = '<div class="alert alert-warning">The selected category does not exist.</div>';
                    return;
                }

                document.getElementById('categoryTitle').innerText = categoryObj.name;
                document.getElementById('categoryDesc').innerText = categoryObj.description || `Browse beautiful products in ${categoryObj.name}.`;

                const res = await fetch(`${window.API_URL}/products?category=${categoryObj._id}`);
                const data = await res.json();
                const products = data.data || [];
                const grid = document.getElementById('productsGrid');

                if (products.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-5 border rounded bg-white"><i class="fas fa-box-open fs-1 text-light mb-3"></i><br>No products found in this category yet.</div>';
                    return;
                }

                grid.innerHTML = products.map(p => {
                    const imgUrl = (p.images && p.images.length > 0) ? p.images[0] : 'https://images.unsplash.com/photo-1610701596007-11502861dcfa?auto=format&fit=crop&q=80';
                    return `
                        <div class="col-md-4 col-sm-6">
                            <div class="card h-100 product-card shadow-sm border-0 position-relative">
                                ${p.qrCodeUrl ? `<img src="${p.qrCodeUrl}" width="40" class="position-absolute bg-white rounded shadow-sm" style="top:10px; right:10px; z-index:2;">` : ''}
                                <span class="badge bg-light text-dark position-absolute border" style="top:10px; left:10px; z-index:2;"><i class="fas fa-check-circle text-success me-1"></i>Verified Origin</span>
                                <div class="card-img-wrapper" style="height: 250px; overflow: hidden;">
                                    <img src="${imgUrl}" class="card-img-top w-100 h-100 object-fit-cover" alt="${p.name}">
                                </div>
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title fw-bold mb-1">${p.name}</h5>
                                    <p class="text-muted small mb-2"><i class="fas fa-user-circle me-1"></i>${p.artisanId.name}</p>
                                    <h4 class="text-primary fw-bold mb-3 price-gold">₹${p.price.toLocaleString()}</h4>
                                    <a href="/product.html?id=${p._id}" class="btn btn-outline-primary fw-bold mt-auto rounded-pill w-100">View Artifact History</a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                document.getElementById('productsGrid').innerHTML = '<div class="alert alert-danger w-100">Failed to load products.</div>';
            }
        });

        function handleSearch(e) {
            e.preventDefault();
            const val = document.getElementById('searchInput').value;
            window.location.href = `/index.html?search=${encodeURIComponent(val)}`;
        }
    </script>
</body>

</html>

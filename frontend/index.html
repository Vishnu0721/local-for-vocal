<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KalaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold" href="index.html">KalaConnect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="nav-links">
                    <!-- Nav links injected by JS -->
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero text-center position-relative">
        <div class="container">
            <h1 class="display-3 fw-bold mb-4 brand-font" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">Handcrafted
                Excellence</h1>
            <p class="lead mb-5" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">Empowering Artisans, Connecting
                Consumers</p>
            <div class="input-group mb-3 w-50 mx-auto shadow-lg rounded">
                <input type="text" id="searchInput" class="form-control form-control-lg border-0"
                    placeholder="Search for pure origin crafts...">
                <button class="btn btn-primary btn-lg px-4" onclick="searchProducts()">Discover</button>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div id="alertBox"></div>
        <div class="text-center mb-5">
            <h2 class="fw-bold brand-font text-dark mb-2">Curated Collections</h2>
            <div style="height: 3px; width: 60px; background-color: var(--accent); margin: 0 auto;"></div>
        </div>

        <!-- Categories Ribbon -->
        <div class="d-flex overflow-auto gap-3 py-3 px-2 mb-4 category-scroll" id="categoryRibbon"
            style="scrollbar-width: none;">
            <!-- Categories injected by JS -->
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
        </div>

        <div class="row g-4" id="products-grid">
            <!-- Products injected by JS -->
            <div class="text-center w-100">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        async function loadCategories() {
            try {
                const res = await fetch(`${window.API_URL}/categories`);
                const data = await res.json();
                const categories = data.data || [];
                const ribbon = document.getElementById('categoryRibbon');

                let html = `<a href="index.html" class="btn btn-outline-primary rounded-pill px-4 fw-bold active">All</a>`;

                categories.forEach(c => {
                    html += `<a href="category.html?slug=${c.slug}" class="btn btn-outline-dark border-0 bg-white shadow-sm rounded-pill px-4 fw-bold">${c.name}</a>`;
                });

                ribbon.innerHTML = html;
            } catch (err) {
                console.error("Failed to load categories", err);
                document.getElementById('categoryRibbon').innerHTML = '';
            }
        }

        async function loadProducts(keyword = '') {
            try {
                const query = keyword ? `?keyword=${keyword}` : '';
                const response = await fetch(`${window.API_URL}/products${query}`);
                const responseData = await response.json();
                const products = responseData.data || [];

                const grid = document.getElementById('products-grid');
                grid.innerHTML = '';

                if (products.length === 0) {
                    grid.innerHTML = '<p class="text-center w-100">No products found.</p>';
                    return;
                }

                products.forEach(p => {
                    const imgUrl = p.images && p.images.length > 0 ? p.images[0] : 'https://via.placeholder.com/300';
                    const artisanName = p.artisanProfile ? p.artisanId.name : 'Local Artisan';
                    const village = p.artisanProfile ? p.artisanProfile.village : 'Visakhapatnam';

                    grid.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100 position-relative">
                                ${p.qrCodeUrl ? `<div class="position-absolute top-0 end-0 m-3 bg-white p-1 rounded shadow-sm" style="z-index: 2;"><img src="${p.qrCodeUrl}" width="40"></div>` : ''}
                                <span class="badge bg-light text-dark position-absolute border" style="top:10px; left:10px; z-index:2;">${p.categoryId ? p.categoryId.name : 'Uncategorized'}</span>
                                <img src="${imgUrl}" class="card-img-top" style="height: 280px; object-fit: cover; border-top-left-radius: 12px; border-top-right-radius: 12px;" alt="${p.name}">
                                <div class="card-body p-4">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h5 class="card-title fw-bold text-dark mb-0 brand-font">${p.name}</h5>
                                        <h5 class="price-gold mb-0">₹${p.price}</h5>
                                    </div>
                                    <p class="text-muted small mb-3"><i class="fas fa-map-marker-alt me-1 text-primary"></i>${village}</p>
                                    <div class="d-flex align-items-center mb-4">
                                        <span class="badge-artisan small">
                                            <i class="fas fa-check-circle me-1"></i>Verified Artisan
                                        </span>
                                        <span class="ms-2 small text-muted">by ${artisanName}</span>
                                    </div>
                                    <a href="product.html?id=${p._id}" class="btn btn-secondary w-100 fw-bold py-2">View Craft</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('alertBox').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
                document.getElementById('products-grid').innerHTML = '';
            }
        }

        function searchProducts() {
            const val = document.getElementById('searchInput').value;
            loadProducts(val);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const urlSearch = urlParams.get('search');

        loadCategories();
        if (urlSearch) {
            document.getElementById('searchInput').value = urlSearch;
            loadProducts(urlSearch);
        } else {
            loadProducts();
        }
    </script>
</body>

</html>
